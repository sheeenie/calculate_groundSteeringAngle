# Which Docker image shall be used on the GitLab runner?
image: docker:24.0

# Details about how to connect to the Docker service to run this build.
variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

services:
  - name: docker:24.0-dind

# Three stages; build, test and deploy (if the tags match the syntax)
stages:
  - build
  - test
  - generate
  - download
  - analyse
  - coverage
  - pages
  - deploy

# Display information before we start the build.
before_script:
  - docker info
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

# This section describes what shall be done to build the project.
build:
  tags:
    - docker-build
  stage: build
  script:
    - apk update && apk add --no-cache curl git make bash
    - docker run --rm --privileged multiarch/qemu-user-static --reset -p y
    - docker buildx create --name builder --use
    - docker buildx inspect --bootstrap

    - rm -rf logs/csv-prev/
    - docker build . --output . --target copytohost

    - docker buildx build --platform linux/amd64,linux/arm/v7 --tag "$CI_REGISTRY_IMAGE:v0.0.2"  --push -f Dockerfile .
  except: 
    - tags

build-images:
  tags:
    - docker-build
  stage: build
  script:
    - git clone --depth=1 --branch v0.0.4 https://github.com/chalmers-revere/opendlv-video-h264-replay.git
    - sed -i 's|http://archive.ubuntu.com/ubuntu/|http://mirror.math.princeton.edu/pub/ubuntu/|g' opendlv-video-h264-replay/Dockerfile # Use a mirror to avoid issues with the default Ubuntu archive
    - docker build -t $CI_REGISTRY_IMAGE/video-h264-replay -f opendlv-video-h264-replay/Dockerfile opendlv-video-h264-replay
    - docker push $CI_REGISTRY_IMAGE/video-h264-replay
    - docker build -f Dockerfile -t $CI_REGISTRY_IMAGE/application .
    - docker push $CI_REGISTRY_IMAGE/application
  
