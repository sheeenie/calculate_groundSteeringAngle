# Which Docker image shall be used on the GitLab runner?
image: docker:24.0

# Details about how to connect to the Docker service to run this build.
variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

services:
  - name: docker:24.0-dind

# Three stages; build, test and deploy (if the tags match the syntax)
stages:
  - build
  - test
  - coverage
  - pages
  - deploy

# Display information before we start the build.
before_script:
  - docker info
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

# This section describes what shall be done to build the project.
build:
  tags:
    - docker-build
  stage: build
  script:
    - apk update && apk add --no-cache curl git make bash
    - docker run --rm --privileged multiarch/qemu-user-static --reset -p y
    - docker buildx create --name builder --use
    - docker buildx inspect --bootstrap

    - docker buildx build --platform linux/amd64,linux/arm/v7 --tag "$CI_REGISTRY_IMAGE:v0.0.2"  --push -f Dockerfile .
  except: 
    - tags

# Test for h264decoder and openDLV microservices
test-h264-opendlv:
  stage: test
  only:
    - 10-h264-opendlv-setup
  tags:
    - docker-build
  script:
    - docker build https://github.com/chalmers-revere/opendlv-video-h264-decoder.git#v0.0.5 -t h264decoder:v0.0.5
    - timeout 10s docker run --rm h264decoder:v0.0.5 --help || echo "h264decoder help timed out or exited"
    - docker pull chrberger/opendlv-vehicle-view:v0.0.64
    - echo "Testing opendlv-vehicle-view startup..."
    - timeout --signal=KILL 10s docker run --rm hsv:latest --name=img --width=640 --height=480 || echo "hsv filter exited or was killed"

# Test for hsv filter microservice
test-hsv-filter:
  stage: test
  only:
    - 11-add-hsv-filter
  tags:
    - docker-build
  script:
    - echo "Building hsv-filter microservice from GitHub..."
    - docker build -t hsv:latest -f Dockerfile https://github.com/chrberger/opendlv-video-hsv-inspector.git

    - echo "Testing hsv-filter microservice startup with timeout..."
    - timeout 10s docker run --rm hsv:latest --name=img --width=640 --height=480 || echo "hsv filter exited or timed out"

# Test for steering angle microservice
test-steering-angle:
  stage: test
  image: ubuntu:22.04
  tags:
    - docker-build
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - ln -fs /usr/share/zoneinfo/Etc/UTC /etc/localtime
    - dpkg-reconfigure -f noninteractive tzdata
    - apt update && apt install -y g++ cmake wget curl unzip pkg-config libopencv-dev libprotobuf-dev protobuf-compiler git

    - mkdir /opt/cluon && cd /opt/cluon
    - curl -L -o cluon-complete.hpp https://github.com/chrberger/libcluon/releases/download/v0.0.132/libcluon-complete-0.0.132.hpp

    - git clone https://github.com/chalmers-revere/opendlv-standard-message-set.git
    - cp opendlv-standard-message-set/*.hpp /usr/local/include/
  script:
    - mkdir -p outputs
    - g++ -std=c++17 -o test_analysis test_analysis.cpp `pkg-config --cflags --libs cluon opencv`
    - mkdir -p output
    - for f in recordings/*.rec; do
        name=$(basename "$f" .rec);
        ./test_analysis --input="$f" --csv="outputs/$name.csv" --svg="outputs/$name.svg";
      done
  artifacts:
    paths:
      - outputs/
    
# This section describes how to generate coverage reports
coverage:
  tags:
    - docker-build
  stage: coverage
  image: alpine:latest
  before_script: []
  script:
    - apk update && apk add --no-cache g++ make cmake lcov gcovr py3-pip python3 gzip
    - mkdir -p build
    - cd build
    - cmake -DCMAKE_CXX_FLAGS="-fprofile-arcs -ftest-coverage" -DCMAKE_C_FLAGS="-fprofile-arcs -ftest-coverage" ..
    - make
    - ./helloworld-Runner --success
    - lcov --capture --directory . --output-file coverage.info
    - lcov --remove coverage.info '/usr/*' '*/test/*' --output-file coverage.info
    - genhtml coverage.info --output-directory lcov-report
    - gcovr --root .. --xml-pretty --output coverage.xml
    - gcovr --root .. --html --html-details -o gcovr-report.html
    
    - cp coverage.info ../
    - cp coverage.xml ../
    - cp -r lcov-report ../
    - mkdir -p ../public
    - cp -r lcov-report/* ../public/

    - mkdir -p ../public
    - cp -r lcov-report/* ../public/
  artifacts:
    paths:
      - public
      - coverage.info
      - lcov-report/
      - coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 52 weeks

# To receive a coverage report in the web UI
pages: 
  tags:
    - docker-build
  stage: pages
  script:
    - echo "Publishing coverage report to GitLab Pages"
    - mv public public_temp && mkdir public && mv public_temp/* public/
  dependencies:
    - coverage
  artifacts:
    paths:
      - public 
  only:
    - 9-add-branch-coverage                  

# This section describes what shall be done to deploy artefacts from the project.
release:
  tags:
    - docker-build
  stage: deploy
  script:
    - apk update && apk add --no-cache curl git make bash
    - docker run --rm --privileged multiarch/qemu-user-static --reset -p y
    - docker buildx create --name builder --use
    - docker buildx inspect --bootstrap

    - docker buildx build --platform linux/amd64,linux/arm/v7 --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" --push -f Dockerfile .
  only:
    - /^v\d+\.\d+\.\d+$/
