# Which Docker image shall be used on the GitLab runner?
image: docker:19.03.3

# Details about how to connect to the Docker service to run this build.
variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

services:
  - name: docker:19.03.3-dind
# Three stages; build, test and deploy (if the tags match the syntax)
stages:
  - build
  - test
  - coverage
  - deploy

# Display information before we start the build.
before_script:
  - docker info
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

# This section describes what shall be done to build the project.
build:
  tags:
    - docker-build
  stage: build
  script:
    - docker build -f Dockerfile .
  except: 
    - tags
# This section describes what shall be done to test the project
test:
  tags:
    - docker-build
  stage: test
  script:
    - apk update && apk add --no-cache g++ make cmake
    - mkdir -p build
    - cd build
    - cmake ..
    - make
    - ./helloworld-Runner --success
  except: 
    - tags

# This section describes how to generate coverage reports
coverage:
  tags:
    - docker-build
  stage: coverage
  image: ubuntu:24.04
  script:
    - apt-get -qq update && apt-get -qq install -y gcovr ggcov lcov cmake make
    - mkdir -p build
    - cd build
    - cmake -DCMAKE_CXX_FLAGS="--coverage" ..
    - make
    - ./helloworld-Runner --success
    - lcov --directory . --capture --output-file coverage.info
    - lcov --remove coverage.info '/usr/*' --output-file coverage.info
    - lcov --list coverage.info
    - genhtml coverage.info --output-directory coverage-html
  artifacts:
    paths:
      - build/coverage-html
      - build/coverage.info
    expire_in: 1 week
  except:
    - tags

# This section describes what shall be done to deploy artefacts from the project.
release:
  tags:
    - docker-build
  stage: deploy
  script:
    - docker build -f Dockerfile -t "$CI_REGISTRY_IMAGE":"$CI_COMMIT_TAG" .
    - docker push "$CI_REGISTRY_IMAGE":"$CI_COMMIT_TAG"
  only:
    - /^v\d+\.\d+\.\d+$/
